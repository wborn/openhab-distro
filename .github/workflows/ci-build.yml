name: CI

on:
  push:
    branches:
      - 'main'
      - 'multi-os'
    paths-ignore:
      - '.github/**/*.md'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '.github/**/*.md'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ '21' ]
        os: [ 'macos-26', 'ubuntu-24.04', 'windows-2025' ]
        include:
          - primary: false
          - java: '21'
            os: 'ubuntu-24.04'
            primary: true
    name: Build (Java ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # typical duration is ~6min, set twice the amount as limit (default is 6h)
    timeout-minutes: 15
    steps:
      - name: Set up line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol crlf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/openhab
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Build
        id: build
        run: |
          javac .github/java/MavenBuild.java
          java -cp .github/java MavenBuild
        env:
          MAVEN_OPTS: >-
            -Xmx2g
            -Dmaven.wagon.http.retryHandler.count=5
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=25
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Prepare Uploads
        id: prepare-uploads
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        shell: bash
        run: |
          uploads="$RUNNER_TEMP/uploads"
          mkdir -p "${uploads}"

          if [[ -f build.log ]]; then
            cp build.log "${uploads}/build-log-java-${{ matrix.java }}-${{ matrix.os }}.txt"
            echo "build-log=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Build Log
        if: ${{ !cancelled() && steps.prepare-uploads.outputs.build-log == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/uploads/build-log-java-${{ matrix.java }}-${{ matrix.os }}.txt
          archive: false
          if-no-files-found: error

      # this will identify modifications to files under source control during the workflow run;
      # untracked files will be included as well!
      - name: Verify Changed Files
        id: verify-changed-files
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          changed_files=$(echo -n "$(git diff --name-only HEAD && git ls-files --others --exclude-standard)" | tr '\n' ' ')
          echo "changed_files=$changed_files" >> $GITHUB_OUTPUT

      - name: Fail on Changed Files
        if: ${{ !cancelled() && steps.verify-changed-files.outputs.changed_files != '' }}
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "::error::Files have changed: $CHANGED_FILES"
          exit 1
